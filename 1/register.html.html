<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет - FridgeChef</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="container">
        <h1>{greeting}</h1>

        <!-- Панель смены темы -->
        <div class="theme-switch">
            <button data-theme="light">Светлая</button>
            <button data-theme="dark">Тёмная</button>
        </div>
        <div id="theme-save-indicator">Тема сохранена!</div>

        <hr style="margin: 30px 0; border: 0; border-top: 1px solid #ccc;">

        <!-- Секция экспорта данных -->
        <div class="export-section" style="margin-bottom: 30px;">
            <h3>Экспорт рецептов</h3>
            <p style="font-size: 14px; margin-bottom: 15px;">Вы можете выгрузить все рецепты из базы данных в файл формата JSON.</p>
            <a href="/api/export_recipes" class="logout-link" style="display: inline-block; padding: 10px 20px; background-color: #1877f2; color: white; text-decoration: none; border-radius: 6px;" download>Скачать базу рецептов</a>
        </div>

        <hr style="margin: 30px 0; border: 0; border-top: 1px solid #ccc;">

        <!-- Секция импорта данных -->
        <div class="import-section" style="margin-bottom: 30px;">
            <h3>Импорт рецептов</h3>
            <p style="font-size: 14px; margin-bottom: 15px;">Загрузите JSON-файл для добавления новых рецептов и ингредиентов на сайт.</p>
            <form id="importForm">
                <input type="file" id="jsonFileInput" accept=".json" required style="padding: 5px; margin-bottom: 10px; border-radius: 4px;">
                <br>
                <button type="submit" style="padding: 10px 20px; background-color: #42b72a; color: white;">Загрузить файл</button>
            </form>
            <p id="importResult" style="margin-top: 15px; font-weight: bold; font-size: 14px;"></p>
        </div>

        <hr style="margin: 30px 0; border: 0; border-top: 1px solid #ccc;">

        <!-- Выход -->
        <p><a href="/logout" class="logout-link">Выйти из аккаунта</a></p>
    </div>

    <script src="/static/profile_app.js"></script>
</body>
</html>
